version: 2

updates:
  # Docker base images (FROM lines in Dockerfiles)
  - package-ecosystem: docker
    directories:
      - /.github/workflows
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)

  # Actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]

  # JavaScript / TypeScript dependencies (package.json and its lock file)
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 5
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Pacific/Auckland
    cooldown:
      default-days: 15
    commit-message:
      prefix: build(deps)
    groups:
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ['*']
        update-types: [minor, patch]
