name: Publish
on:
  push:
    branches-ignore:
      - gh-readonly-queue/**
  merge_group:
  workflow_dispatch:

jobs:
  publish:
    uses: linz/topo-workflows/.github/workflows/publish.yml@8b0f1ba6cb853269cced00ca935d4e5844cf1081
    with:
      user_group: land
      odr_bucket: s3://nz-imagery/
    secrets: inherit

  ci-ok:
    if: always()
    needs: [publish]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
